<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
  width: 100%;
  height: 100%;
  position: relative;
}

.topImg {
  width: 120px;
  margin-top: 12vh;
}

h1 {
  font-size: 2.8rem;
  color: white;
}

button {
  padding: 14px 32px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  position: absolute;
  top: 55%;
}

#yes {
  background: #28a745;
  color: white;
  left: 35%;
}

#no {
  background: #dc3545;
  color: white;
  left: 60%;
}

#overlay {
  position: fixed;
  inset: 0;
  background: black;
  display: none;
  z-index: 9999;
}

/* Base style */
.centerMedia {
  position: absolute;
  inset: 0;
  margin: auto;
  object-fit: contain;
  opacity: 0;
  transition: opacity 1s ease, filter 1s ease;
}

/* Individual sizing */
#willi { width: 90vw; height: 90vh; }
#mid1  { width: 95vw; height: 85vh; }
#vid   { width: 90vw; height: 80vh; object-fit: cover; }
#final { width: 90vw; height: 90vh; }
</style>
</head>

<body>

<div class="container">
  <img src="dog.png" class="topImg">
  <h1>Will you be my Valentine? ❤️</h1>
  <button id="yes" onclick="yesClicked()">YES</button>
  <button id="no">NO</button>
</div>

<div id="overlay"></div>

<audio id="bgMusic" src="rjo.m4a"></audio>

<script>
const noBtn = document.getElementById("no");

let x = window.innerWidth * 0.6;
let y = window.innerHeight * 0.55;
let vx = 0;
let vy = 0;

const speed = 12;
const radius = 140;
const damping = 0.9;

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

function animate() {
  x += vx;
  y += vy;

  const rect = noBtn.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width;
  const maxY = window.innerHeight - rect.height;

  if (x <= 0 || x >= maxX) vx *= -1;
  if (y <= 0 || y >= maxY) vy *= -1;

  x = clamp(x, 0, maxX);
  y = clamp(y, 0, maxY);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  vx *= damping;
  vy *= damping;

  requestAnimationFrame(animate);
}

document.addEventListener("mousemove", e => {
  const rect = noBtn.getBoundingClientRect();
  const bx = rect.left + rect.width / 2;
  const by = rect.top + rect.height / 2;

  const dx = bx - e.clientX;
  const dy = by - e.clientY;
  const dist = Math.hypot(dx, dy);

  if (dist < radius) {
    const angle = Math.atan2(dy, dx);
    vx += Math.cos(angle) * speed;
    vy += Math.sin(angle) * speed;
  }
});

animate();

function fadeIn(el, bright=true) {
  el.style.filter = bright ? "brightness(130%)" : "brightness(100%)";
  el.style.opacity = 1;
}

function fadeOut(el) {
  el.style.opacity = 0;
}

function yesClicked() {
  const overlay = document.getElementById("overlay");
  const music = document.getElementById("bgMusic");

  overlay.style.display = "block";
  overlay.innerHTML = `
    <img id="willi" src="willi.png" class="centerMedia">
    <img id="mid1" src="bh.jpg" class="centerMedia">
    <video id="vid" src="panda.mp4" class="centerMedia"></video>
    <img id="final" src="final.png" class="centerMedia">
  `;

  music.volume = 0.7;
  music.play();

  const willi = document.getElementById("willi");
  const mid1 = document.getElementById("mid1");
  const vid = document.getElementById("vid");
  const final = document.getElementById("final");

  setTimeout(() => fadeIn(willi), 300);
  setTimeout(() => fadeOut(willi), 2000);

  setTimeout(() => fadeIn(mid1), 2300);
  setTimeout(() => fadeOut(mid1), 4300);

  setTimeout(() => {
    vid.currentTime = 0;
    vid.play();
    fadeIn(vid);
  }, 4600);

  setTimeout(() => fadeOut(vid), 9800);

  setTimeout(() => fadeIn(final,false), 10300);
}
</script>

</body>
</html>
